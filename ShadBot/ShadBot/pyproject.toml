[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "shadbot-projectintelligence"
version = "0.1.0"
description = "ShadBot Project Intelligence Engine"
requires-python = ">=3.14"

dependencies = [
    "pytest",
    "ruff",
    "black",
    "mypy",
    "GitPython",
    "pyyaml"
]

[project.scripts]
shadbot-intelligence = "projectintelligence.cli.main:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.setuptools.package-data]
projectintelligence = ["py.typed"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
mypy_path = "src"