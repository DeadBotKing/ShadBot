[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "shadbot-projectintelligence"
version = "0.1.0"
description = "ShadBot Project Intelligence Engine"
requires-python = ">=3.14"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.black]
line-length = 88
target-version = ["py314"]